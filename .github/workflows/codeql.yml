name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday morning
  workflow_dispatch:

permissions:
  security-events: write
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: true

      - uses: xavierLowmiller/xcodegen-action@e5af38841cc8e1b8ace551066402a97f146a9bbd # 1.2.4
        with:
          install: true
          run: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Compute Ghostty cache key
        id: ghostty-key
        run: echo "key=ghostty-$(git -C ghostty rev-parse HEAD)-zig-0.15.2-macos15" >> "$GITHUB_OUTPUT"

      - name: Cache Ghostty xcframework
        id: ghostty-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ghostty/macos/GhosttyKit.xcframework
            ghostty/zig-out
          key: ${{ steps.ghostty-key.outputs.key }}

      - name: Build Ghostty xcframework
        if: steps.ghostty-cache.outputs.cache-hit != 'true'
        run: |
          cd ghostty
          zig build -Demit-xcframework=true -Dxcframework-target=aarch64-macos -Doptimize=ReleaseFast

      - name: Initialize CodeQL
        uses: github/codeql-action/init@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3
        with:
          languages: swift
          build-mode: manual

      - name: Build for analysis
        run: |
          xcodegen generate
          xcodebuild -project Dockyard.xcodeproj -scheme Dockyard -configuration Debug -destination 'generic/platform=macOS' build

      - name: Analyze
        uses: github/codeql-action/analyze@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3
        with:
          category: "/language:swift"
