name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday morning
  workflow_dispatch:

permissions:
  security-events: write
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap, interpreted-language scans: workflow files and editor/website JS.
  # These run on every push, PR, and the weekly schedule.
  analyze-quick:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3
        with:
          category: "/language:${{ matrix.language }}"

  # Swift requires build-mode: manual, which means the full Ghostty
  # xcframework toolchain (same as ci.yml): ~10-15 min cold, ~5 min warm on
  # a macOS runner. Keep it off the per-PR path so PRs aren't gated behind a
  # second macOS build on top of ci.yml's own build+test job; it still runs
  # on every push to main and the weekly schedule, giving full coverage
  # without doubling macOS runner minutes per PR.
  analyze-swift:
    name: Analyze (swift)
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: true

      # Match the Xcode the codebase is developed against (see docs/install-from-source.md).
      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - uses: xavierLowmiller/xcodegen-action@e5af38841cc8e1b8ace551066402a97f146a9bbd # 1.2.4
        with:
          install: true
          run: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Compute Ghostty cache key
        id: ghostty-key
        run: echo "key=ghostty-v3-$(git -C ghostty rev-parse HEAD)-zig-0.15.2-macos15" >> "$GITHUB_OUTPUT"

      - name: Cache Ghostty xcframework
        id: ghostty-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ghostty/macos/GhosttyKit.xcframework
            ghostty/zig-out
          key: ${{ steps.ghostty-key.outputs.key }}

      - name: Build Ghostty xcframework
        if: steps.ghostty-cache.outputs.cache-hit != 'true'
        run: |
          cd ghostty
          zig build -Demit-xcframework=true -Demit-macos-app=false -Doptimize=ReleaseFast

      - name: Verify Ghostty artifacts
        run: |
          test -d ghostty/macos/GhosttyKit.xcframework/macos-arm64_x86_64
          test -d ghostty/zig-out/share/terminfo
          test -d ghostty/zig-out/share/ghostty

      - name: Initialize CodeQL
        uses: github/codeql-action/init@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3
        with:
          languages: swift
          build-mode: manual

      - name: Build for analysis
        run: ./scripts/dev.sh build

      - name: Analyze
        uses: github/codeql-action/analyze@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3
        with:
          category: "/language:swift"
