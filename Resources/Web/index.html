<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dockyard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dockyard">
  <meta name="theme-color" content="#0a0c10">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <button id="menu-btn" class="menu-btn" aria-label="Open sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <div class="current-workstream-title">
          <div id="current-ws-name" class="title-main">Dockyard</div>
          <div id="current-ws-branch" class="title-sub">Loading...</div>
        </div>
      </div>
      <div class="header-right">
        <div id="connection-pill" class="connection-pill">
          <span class="dot"></span>
          <span id="connection-text">Connecting</span>
        </div>
      </div>
    </header>

    <!-- Agent Attention Alert Banner (When agent is waiting) -->
    <div id="agent-waiting-banner" class="agent-waiting-banner" style="display: none;">
      <div id="waiting-text" class="agent-waiting-text">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        Agent waiting for input
      </div>
      <div class="waiting-actions">
        <button id="btn-approve" class="btn-approve">Approve (y)</button>
        <button id="btn-deny" class="btn-deny">Deny (n)</button>
      </div>
    </div>

    <!-- Terminal Container -->
    <main class="terminal-container">
      <div id="terminal-mirror" class="terminal-mirror">Connecting to agent session...</div>
      <button id="scroll-bottom-btn" class="scroll-bottom-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <polyline points="19 12 12 19 5 12"></polyline>
        </svg>
        Scroll to bottom
      </button>
    </main>

    <!-- Floating Action Bar -->
    <footer class="action-bar">
      <div class="quick-keys-row">
        <button class="key-btn danger" data-key="ctrl-c">Ctrl+C</button>
        <button class="key-btn" data-key="enter">Enter ↵</button>
        <button class="key-btn" data-key="tab">Tab ⇥</button>
        <button class="key-btn" data-key="esc">Esc</button>
        <button class="key-btn" data-key="clear">Clear</button>
        <button id="btn-toggle-wrap" class="key-btn" data-key="wrap">Wrap ↩</button>
        <button id="btn-font-size" class="key-btn" data-key="font-size">Aa</button>
      </div>
      <div class="input-row">
        <input type="text" id="prompt-input" class="prompt-input" placeholder="Type prompt or command..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <input type="file" id="image-input" accept="image/*" style="display: none;">
        <button id="image-btn" class="image-btn" aria-label="Upload image" title="Upload image">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect>
            <circle cx="9" cy="9" r="2"></circle>
            <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path>
          </svg>
        </button>
        <button id="mic-btn" class="mic-btn" aria-label="Voice input">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="22"></line>
          </svg>
        </button>
        <button id="send-btn" class="send-btn" aria-label="Send">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </footer>

    <!-- Sidebar Drawer (Projects & Workstreams) -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>
    <aside id="sidebar-drawer" class="sidebar-drawer">
      <div class="drawer-header">
        <div class="drawer-title">Workstreams</div>
        <button id="drawer-close-btn" class="drawer-close-btn" aria-label="Close sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div id="drawer-content" class="drawer-content">
        <!-- Rendered dynamically -->
      </div>
    </aside>
  </div>

  <script src="/app.js"></script>
</body>
</html>
