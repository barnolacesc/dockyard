# ABOUTME: Hugo configuration for the Dockyard website.
# ABOUTME: Multi-language site deployed to dockyard.barnola.net via GitHub Pages.

baseURL = "https://dockyard.barnola.net"
title = "Dockyard"
defaultContentLanguage = "en"

[languages.en]
  languageCode = "en"
  languageName = "English"
  weight = 1
  contentDir = "content"

[languages.ca]
  languageCode = "ca"
  languageName = "Catala"
  weight = 2
  contentDir = "content/ca"

[params]
  description = "A native macOS app that manages git worktrees, coding agent sessions, and dev servers from a single window."
  ogImage = "/img/og-image.png"
  githubURL = "https://github.com/barnolacesc/dockyard"
  downloadURL = "https://github.com/barnolacesc/dockyard/releases/latest/download/Dockyard.dmg"

[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"

[markup.goldmark.parser.attribute]
  block = true
  title = true

[markup.goldmark.renderer]
  unsafe = true


[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
