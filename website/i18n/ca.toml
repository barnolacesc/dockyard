# Features
[features_label]
other = "Funcionalitats"
[features_title]
other = "Tot en una finestra."
[features_desc]
other = "Prou de fer malabars amb terminals, browsers i clients git. Cada workstream és un entorn dev complet."
[feat_worktrees_title]
other = "Git Worktrees"
[feat_worktrees_desc]
other = "Cada workstream té branch i worktree propis. Canvia de tasca sense stash, amb fitxers .env symlinkats automàticament."
[feat_claude_title]
other = "Claude Code, Antigravity i Codex"
[feat_claude_desc]
other = "Executa <a href='https://docs.anthropic.com/en/docs/claude-code/overview' class='text-brand-light no-underline hover:underline'>Claude Code</a>, Antigravity CLI o <a href='https://developers.openai.com/codex' class='text-brand-light no-underline hover:underline'>Codex</a> amb represa automàtica i mode YOLO."
[feat_tmux_title]
other = "Persistència tmux"
[feat_tmux_desc]
other = "Les sessions d'agent sobreviuen reinicis via tmux en un socket dedicat. Mai més context perdut ni workflows interromputs."
[feat_scripts_title]
other = "Scripts de Setup i Run"
[feat_scripts_desc]
other = "Configura scripts de setup, run i teardown per projecte via .dockyard.json amb detecció automàtica de ports."
[feat_browser_title]
other = "Navegador incrustat i pantalla dividida"
[feat_browser_desc]
other = "Previsualitza la teva app web en paral·lel amb detecció automàtica de ports (:3000, :5001...) sense sortir de l'espai de treball."
[feat_github_title]
other = "GitHub Issues i popovers CI"
[feat_github_desc]
other = "Crea workstreams des d'issues de GitHub, inspecciona checks de CI en viu amb revisions IA de CodeRabbit i gestiona PRs a l'instant."

# How it works
[how_label]
other = "Com funciona"
[how_title]
other = "Tres passos per desenvolupar en paral·lel."
[how_desc]
other = "Del repo a un workstream actiu en segons. Cada workstream és aïllat i autònom."
[step1_title]
other = "Afegeix un projecte"
[step1_desc]
other = "Arrossega un directori al sidebar o crea'n un de nou. Dockyard detecta repos git, eines instal·lades i connexions GitHub automàticament."
[step2_title]
other = "Crea un workstream"
[step2_desc]
other = "Un worktree nou amb branch, el CLI de codi que hagis triat, terminal i tab de browser. La detecció de port és automàtica — el browser obre el teu servidor dev tan bon punt comença a escoltar."
[step3_title]
other = "Programa amb IA"
[step3_desc]
other = "L'agent es posa a treballar immediatament. Els setup scripts instal·len dependències. Canvia entre workstreams sense perdre estat."

# Config
[config_label]
other = "Configuració"
[config_title]
other = "Scripts drop-in."
[config_desc]
other = "Automatitza el cicle de vida dels workstreams amb scripts de setup, run i teardown. Instal·la dependències al crear un worktree, arrenca servidors dev sota demanda i allibera recursos en arxivar."
[config_add]
other = "Afegeix un"
[config_or_use]
other = "a l'arrel del projecte."
[config_hook]
other = "Hook"
[config_when]
other = "Quan s'executa"
[config_setup_desc]
other = "Un cop, quan es crea un workstream. Per instal·lar dependències o passos de build."
[config_run_desc]
other = "Sota demanda des de la pestanya Environment. Embolcallat amb dy-run per detectar ports automàticament."
[config_teardown_desc]
other = "Quan s'arxiva un workstream. Per netejar recursos com aturar contenidors."
[config_optional_note]
other = "Tots els camps són opcionals. Els scripts s'executen al directori del workstream amb el teu shell de login."

