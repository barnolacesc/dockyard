other = "App nativa de macOS sobre el terminal GPU de <a href=\"https://ghostty.org\" class=\"text-brand-light hover:underline\">Ghostty</a>. Gestiona git worktrees, sessions d'agent de codi i servidors dev des d'una sola finestra. Cada workstream té branch, terminal i agent propis, tot en paral·lel, tot a velocitat nativa."
