<div id="preview-showcase" class="mt-8 md:mt-14 animate-fade-up-4">
  <!-- Interactive tab switcher -->
  <div class="flex items-center justify-start md:justify-center gap-1.5 md:gap-2 mb-4 overflow-x-auto pb-2 scrollbar-none select-none" role="tablist" aria-label="Dockyard screenshots">
    <button type="button" role="tab" id="tab-btn-agent" onclick="showScreenshot('agent')" aria-selected="true" aria-controls="panel-agent" class="ss-tab ss-tab-active flex items-center gap-2 font-mono text-xs px-3 md:px-3.5 py-2 rounded-lg border border-brand bg-brand/15 text-fg font-medium transition-all shadow-[0_2px_8px_rgba(0,0,0,0.2)] cursor-pointer whitespace-nowrap">
      <svg class="w-3.5 h-3.5 text-brand-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg>
      <span>{{ T "hero_tab_agent" }}</span>
    </button>
    <button type="button" role="tab" id="tab-btn-browser" onclick="showScreenshot('browser')" aria-selected="false" aria-controls="panel-browser" class="ss-tab flex items-center gap-2 font-mono text-xs px-3 md:px-3.5 py-2 rounded-lg border border-fg-faint bg-bg-surface/80 text-fg-muted hover:text-fg hover:border-fg-faint hover:bg-bg-elevated transition-all cursor-pointer whitespace-nowrap">
      <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      <span>{{ T "hero_tab_browser" }}</span>
    </button>
    <button type="button" role="tab" id="tab-btn-ci" onclick="showScreenshot('ci')" aria-selected="false" aria-controls="panel-ci" class="ss-tab flex items-center gap-2 font-mono text-xs px-3 md:px-3.5 py-2 rounded-lg border border-fg-faint bg-bg-surface/80 text-fg-muted hover:text-fg hover:border-fg-faint hover:bg-bg-elevated transition-all cursor-pointer whitespace-nowrap">
      <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      <span>{{ T "hero_tab_ci" }}</span>
    </button>
    <button type="button" role="tab" id="tab-btn-issues" onclick="showScreenshot('issues')" aria-selected="false" aria-controls="panel-issues" class="ss-tab flex items-center gap-2 font-mono text-xs px-3 md:px-3.5 py-2 rounded-lg border border-fg-faint bg-bg-surface/80 text-fg-muted hover:text-fg hover:border-fg-faint hover:bg-bg-elevated transition-all cursor-pointer whitespace-nowrap">
      <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
      <span>{{ T "hero_tab_issues" }}</span>
    </button>
    <button type="button" role="tab" id="tab-btn-worktrees" onclick="showScreenshot('worktrees')" aria-selected="false" aria-controls="panel-worktrees" class="ss-tab flex items-center gap-2 font-mono text-xs px-3 md:px-3.5 py-2 rounded-lg border border-fg-faint bg-bg-surface/80 text-fg-muted hover:text-fg hover:border-fg-faint hover:bg-bg-elevated transition-all cursor-pointer whitespace-nowrap">
      <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>
      <span>{{ T "hero_tab_worktrees" }}</span>
    </button>
    <button type="button" role="tab" id="tab-btn-stages" onclick="showScreenshot('stages')" aria-selected="false" aria-controls="panel-stages" class="ss-tab flex items-center gap-2 font-mono text-xs px-3 md:px-3.5 py-2 rounded-lg border border-fg-faint bg-bg-surface/80 text-fg-muted hover:text-fg hover:border-fg-faint hover:bg-bg-elevated transition-all cursor-pointer whitespace-nowrap">
      <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span>{{ T "hero_tab_stages" }}</span>
    </button>
  </div>

  <!-- macOS Native Window Frame -->
  <div class="rounded-xl md:rounded-2xl overflow-hidden border border-fg-faint bg-bg-surface shadow-[0_20px_60px_var(--color-shadow)] transition-all">
    <!-- Window Titlebar -->
    <div class="flex items-center justify-between px-4 py-3 border-b border-fg-faint bg-bg/80 backdrop-blur-sm select-none" aria-hidden="true">
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 rounded-full bg-[#ff5f56] border border-black/10 inline-block"></span>
        <span class="w-3 h-3 rounded-full bg-[#ffbd2e] border border-black/10 inline-block"></span>
        <span class="w-3 h-3 rounded-full bg-[#27c93f] border border-black/10 inline-block"></span>
        <span id="window-title" class="ml-3 font-mono text-xs text-fg-muted truncate max-w-[200px] sm:max-w-xs md:max-w-md">{{ T "hero_title_agent" }}</span>
      </div>
      <button onclick="openCurrentScreenshotModal()" class="inline-flex items-center gap-1.5 text-xs text-fg-muted hover:text-fg font-mono px-2.5 py-1 rounded-md border border-fg-faint/60 hover:border-fg-faint bg-bg-surface/60 transition-colors cursor-pointer" title="{{ T "hero_zoom_hint" }}">
        <svg class="w-3.5 h-3.5 text-brand-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
        <span class="hidden sm:inline">{{ T "hero_zoom_hint" }}</span>
      </button>
    </div>

    <!-- Screenshots viewport -->
    <div class="relative bg-bg cursor-zoom-in group overflow-hidden" onclick="openCurrentScreenshotModal()" title="{{ T "hero_zoom_hint" }}">
      <!-- Agent -->
      <div id="panel-agent" class="ss-panel w-full" role="tabpanel" aria-labelledby="tab-btn-agent">
        <img src="/img/screenshots/agent.webp" alt="{{ T "hero_caption_agent" }}" class="w-full h-auto block select-none group-hover:scale-[1.006] transition-transform duration-300" loading="eager" width="3160" height="2034">
      </div>

      <!-- Browser -->
      <div id="panel-browser" class="ss-panel w-full hidden" role="tabpanel" aria-labelledby="tab-btn-browser">
        <img src="/img/screenshots/browser.webp" alt="{{ T "hero_caption_browser" }}" class="w-full h-auto block select-none group-hover:scale-[1.006] transition-transform duration-300" loading="lazy" width="2576" height="1673">
      </div>

      <!-- CI & AI Reviews -->
      <div id="panel-ci" class="ss-panel w-full hidden" role="tabpanel" aria-labelledby="tab-btn-ci">
        <img src="/img/screenshots/ci-review.webp" alt="{{ T "hero_caption_ci" }}" class="w-full h-auto block select-none group-hover:scale-[1.006] transition-transform duration-300" loading="lazy" width="3248" height="2122">
      </div>

      <!-- GitHub Issues -->
      <div id="panel-issues" class="ss-panel w-full hidden" role="tabpanel" aria-labelledby="tab-btn-issues">
        <img src="/img/screenshots/github-issues.webp" alt="{{ T "hero_caption_issues" }}" class="w-full h-auto block select-none group-hover:scale-[1.006] transition-transform duration-300" loading="lazy" width="3160" height="2034">
      </div>

      <!-- Git Worktrees -->
      <div id="panel-worktrees" class="ss-panel w-full hidden" role="tabpanel" aria-labelledby="tab-btn-worktrees">
        <img src="/img/screenshots/worktrees.webp" alt="{{ T "hero_caption_worktrees" }}" class="w-full h-auto block select-none group-hover:scale-[1.006] transition-transform duration-300" loading="lazy" width="3160" height="2034">
      </div>

      <!-- Lifecycle Stages -->
      <div id="panel-stages" class="ss-panel w-full hidden" role="tabpanel" aria-labelledby="tab-btn-stages">
        <img src="/img/screenshots/lifecycle-stages.webp" alt="{{ T "hero_caption_stages" }}" class="w-full h-auto block select-none group-hover:scale-[1.006] transition-transform duration-300" loading="lazy" width="3160" height="2034">
      </div>

      <!-- Hover hint pill -->
      <div class="absolute bottom-3 right-3 hidden md:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-bg-surface/90 backdrop-blur-md border border-fg-faint text-[11px] font-mono text-fg-dim shadow-lg pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity duration-200">
        <svg class="w-3.5 h-3.5 text-brand-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        <span>{{ T "hero_zoom_hint" }}</span>
      </div>
    </div>

    <!-- Caption / Tags Footer -->
    <div class="px-4 sm:px-6 py-4 border-t border-fg-faint bg-bg-surface/90 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 text-xs">
      <div class="flex items-center gap-2.5 flex-wrap">
        <span id="ss-tag" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full font-mono text-[11px] font-medium bg-brand/15 text-brand-light border border-brand/30">
          {{ T "hero_tag_agent" }}
        </span>
        <p id="ss-caption" class="text-fg-dim font-sans text-xs sm:text-sm leading-relaxed max-w-[720px]">
          {{ T "hero_caption_agent" }}
        </p>
      </div>
      <div class="flex items-center gap-1.5 self-end sm:self-center text-fg-muted font-mono text-[11px] shrink-0">
        <span id="ss-counter">1 / 6</span>
      </div>
    </div>
  </div>
</div>

<!-- Screenshot Modal Lightbox -->
<dialog id="ss-modal" class="modal bg-black/80 backdrop-blur-md">
  <div class="modal-box max-w-none w-[96vw] md:w-[92vw] lg:w-[88vw] p-0 bg-bg border border-fg-faint rounded-xl md:rounded-2xl overflow-hidden shadow-2xl flex flex-col">
    <!-- Modal Header -->
    <div class="flex items-center justify-between px-4 sm:px-5 py-3 border-b border-fg-faint bg-bg-surface select-none">
      <div class="flex items-center gap-2 truncate">
        <span class="w-2.5 h-2.5 rounded-full bg-[#ff5f56] inline-block"></span>
        <span class="w-2.5 h-2.5 rounded-full bg-[#ffbd2e] inline-block"></span>
        <span class="w-2.5 h-2.5 rounded-full bg-[#27c93f] inline-block"></span>
        <span id="ss-modal-title" class="font-mono text-xs text-fg-dim truncate ml-2"></span>
      </div>
      <form method="dialog" class="flex items-center gap-2">
        <button class="px-2.5 py-1 rounded-md bg-bg-elevated border border-fg-faint text-fg hover:bg-fg-faint font-mono text-xs transition-colors cursor-pointer flex items-center gap-1">
          <span>✕</span>
          <span class="hidden sm:inline">{{ T "hero_modal_close" }}</span>
        </button>
      </form>
    </div>

    <!-- Modal Body -->
    <div class="relative bg-black/40 flex items-center justify-center p-2 sm:p-4 max-h-[76vh] overflow-auto">
      <img id="ss-modal-img" class="max-w-full max-h-[72vh] object-contain rounded-lg shadow-xl" src="" alt="">

      <!-- Nav arrows -->
      <button type="button" onclick="navigateModal(-1)" class="absolute left-4 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-bg-surface/90 hover:bg-bg-elevated border border-fg-faint flex items-center justify-center text-fg text-lg font-mono transition-transform hover:scale-110 cursor-pointer shadow-xl select-none" aria-label="{{ T "hero_modal_prev" }}">
        ‹
      </button>
      <button type="button" onclick="navigateModal(1)" class="absolute right-4 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-bg-surface/90 hover:bg-bg-elevated border border-fg-faint flex items-center justify-center text-fg text-lg font-mono transition-transform hover:scale-110 cursor-pointer shadow-xl select-none" aria-label="{{ T "hero_modal_next" }}">
        ›
      </button>
    </div>

    <!-- Modal Footer Caption -->
    <div class="px-5 py-3 border-t border-fg-faint bg-bg-surface flex items-center justify-between gap-4 text-xs">
      <p id="ss-modal-caption" class="text-fg-dim font-sans text-xs sm:text-sm leading-relaxed max-w-3xl"></p>
      <span id="ss-modal-counter" class="font-mono text-fg-muted shrink-0 text-[11px]"></span>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop bg-black/60">
    <button>close</button>
  </form>
</dialog>

<script>
var screenshotsData = {
  agent: {
    title: "{{ T "hero_title_agent" }}",
    caption: "{{ T "hero_caption_agent" }}",
    tag: "{{ T "hero_tag_agent" }}",
    index: 1,
    imgSrc: "/img/screenshots/agent.webp"
  },
  browser: {
    title: "{{ T "hero_title_browser" }}",
    caption: "{{ T "hero_caption_browser" }}",
    tag: "{{ T "hero_tag_browser" }}",
    index: 2,
    imgSrc: "/img/screenshots/browser.webp"
  },
  ci: {
    title: "{{ T "hero_title_ci" }}",
    caption: "{{ T "hero_caption_ci" }}",
    tag: "{{ T "hero_tag_ci" }}",
    index: 3,
    imgSrc: "/img/screenshots/ci-review.webp"
  },
  issues: {
    title: "{{ T "hero_title_issues" }}",
    caption: "{{ T "hero_caption_issues" }}",
    tag: "{{ T "hero_tag_issues" }}",
    index: 4,
    imgSrc: "/img/screenshots/github-issues.webp"
  },
  worktrees: {
    title: "{{ T "hero_title_worktrees" }}",
    caption: "{{ T "hero_caption_worktrees" }}",
    tag: "{{ T "hero_tag_worktrees" }}",
    index: 5,
    imgSrc: "/img/screenshots/worktrees.webp"
  },
  stages: {
    title: "{{ T "hero_title_stages" }}",
    caption: "{{ T "hero_caption_stages" }}",
    tag: "{{ T "hero_tag_stages" }}",
    index: 6,
    imgSrc: "/img/screenshots/lifecycle-stages.webp"
  }
};

var tabKeys = ['agent', 'browser', 'ci', 'issues', 'worktrees', 'stages'];
var currentScreenshotKey = 'agent';

function showScreenshot(key) {
  if (!screenshotsData[key]) return;
  currentScreenshotKey = key;
  var data = screenshotsData[key];

  // Panels visibility
  document.querySelectorAll('.ss-panel').forEach(function(panel) {
    panel.classList.add('hidden');
  });
  var activePanel = document.getElementById('panel-' + key);
  if (activePanel) {
    activePanel.classList.remove('hidden');
  }

  // Tabs styling
  document.querySelectorAll('.ss-tab').forEach(function(tab) {
    tab.classList.remove('ss-tab-active', 'border-brand', 'bg-brand/15', 'text-fg', 'font-medium', 'shadow-[0_2px_8px_rgba(0,0,0,0.2)]');
    tab.classList.add('border-fg-faint', 'bg-bg-surface/80', 'text-fg-muted');
    tab.setAttribute('aria-selected', 'false');
    var icon = tab.querySelector('svg');
    if (icon) icon.classList.remove('text-brand-light');
  });

  var activeTab = document.getElementById('tab-btn-' + key);
  if (activeTab) {
    activeTab.classList.add('ss-tab-active', 'border-brand', 'bg-brand/15', 'text-fg', 'font-medium', 'shadow-[0_2px_8px_rgba(0,0,0,0.2)]');
    activeTab.classList.remove('border-fg-faint', 'bg-bg-surface/80', 'text-fg-muted');
    activeTab.setAttribute('aria-selected', 'true');
    var icon = activeTab.querySelector('svg');
    if (icon) icon.classList.add('text-brand-light');
  }

  // Window titlebar & caption footer
  var windowTitle = document.getElementById('window-title');
  if (windowTitle) windowTitle.textContent = data.title;

  var tag = document.getElementById('ss-tag');
  if (tag) tag.textContent = data.tag;

  var caption = document.getElementById('ss-caption');
  if (caption) caption.textContent = data.caption;

  var counter = document.getElementById('ss-counter');
  if (counter) counter.textContent = data.index + ' / ' + tabKeys.length;
}

function openScreenshotModal(key) {
  var data = screenshotsData[key || currentScreenshotKey];
  if (!data) return;

  var modal = document.getElementById('ss-modal');
  var modalImg = document.getElementById('ss-modal-img');
  var modalTitle = document.getElementById('ss-modal-title');
  var modalCaption = document.getElementById('ss-modal-caption');
  var modalCounter = document.getElementById('ss-modal-counter');

  modalImg.src = data.imgSrc;
  modalImg.alt = data.caption;
  modalTitle.textContent = data.title;
  modalCaption.textContent = data.caption;
  modalCounter.textContent = data.index + ' / ' + tabKeys.length;

  if (typeof modal.showModal === 'function') {
    modal.showModal();
  }
}

function openCurrentScreenshotModal() {
  openScreenshotModal(currentScreenshotKey);
}

function navigateModal(direction) {
  var currentIndex = tabKeys.indexOf(currentScreenshotKey);
  var nextIndex = (currentIndex + direction + tabKeys.length) % tabKeys.length;
  var nextKey = tabKeys[nextIndex];
  showScreenshot(nextKey);
  openScreenshotModal(nextKey);
}

// Lightbox keyboard navigation
document.addEventListener('keydown', function(e) {
  var modal = document.getElementById('ss-modal');
  if (!modal || !modal.open) return;
  if (e.key === 'ArrowLeft') {
    navigateModal(-1);
  } else if (e.key === 'ArrowRight') {
    navigateModal(1);
  }
});

// Preload remaining WebP images after initial load to make tab switching instantaneous
window.addEventListener('load', function() {
  tabKeys.forEach(function(k) {
    if (k !== 'agent') {
      var img = new Image();
      img.src = '/img/screenshots/' + (k === 'ci' ? 'ci-review' : (k === 'issues' ? 'github-issues' : (k === 'stages' ? 'lifecycle-stages' : k))) + '.webp';
    }
  });
});
</script>
